<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity List</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/128/8888/8888050.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script> 
   <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>  

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #e2eff1;
      color: #1c1c1e;
        font-family: 'Roboto';font-size: 22px;


    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }

    h1 {
      margin: 0 0 6px;
      font-size: 34px;
      font-weight: 700;
    }

    .status {
      color: #6e6e73;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .add-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      border: none;
      background: white;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.15s;
    }

    button:active {
      transform: scale(0.96);
    }

    #addBtn {
      background: #2b3467;
      color: white;
      border-radius: 10px;
      width: 35px;
      font-size: 16px;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .todo input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      padding: 0;
      border: 2px solid #c7c7cc;
      border-radius: 50%;
      box-shadow: none;
      background: white;
    }

    .todo input[type="checkbox"]:checked {
      background: #34c759;
      border-color: #34c759;
      position: relative;
    }

    .todo input[type="checkbox"]:checked::after {
      content: "✓";
      color: white;
      position: absolute;
      left: 5px;
      top: 0px;
      font-size: 16px;
      font-weight: bold;
    }

    .todo-text {
      flex: 1;
      font-size: 16px;
      word-break: break-word;
    }

    .completed .todo-text {
      color: #8e8e93;
      text-decoration: line-through;
    }

    .delete-btn {
      width: 40px;
      height: 40px;
      color: white;
      border-radius: 50%;
      font-size: 18px;
    }

    .bottom-actions {
      margin-top: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #clearCompleted {
      background: none;
      color: #000000;
      margin-bottom: 2%;
    }


    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
          font-family: 'Roboto';font-size: 22px;
    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }


    h1 {
      margin: 0 0 6px;
      font-size: 34px;
      font-weight: 700;
    }

    .status {
      color: #6e6e73;
      font-size: 15px;
    }

    .add-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }


    
  </style>
</head>
<body>

      <main class="app">
        <header>
    <h2>กิจกรรม</h2>
    </header>
  

    <div class="bottom-actions">
      <span></span>
      <button id="clearCompleted">ล้าง</button>
    </div>

    <div class="add-box">
      <input
        type="text"
        id="todoInput"
        placeholder="เพิ่มงานใหม่..."
        autocomplete="off"
      >
      <button id="addBtn" aria-label="เพิ่มงาน">+</button>
    </div>

      <div class="status" id="status">ยังไม่มีงาน</div>


    <div class="todo-list" id="todoList"></div>


    <!-- <div class="todo">
        <input type="checkbox"
              ${todo.completed ? "checked" : ""}>
            <div class="todo-text"> xxx </div>
            <button class="delete-btn" aria-label="ลบงาน">🗑️</button>
    </div> -->


      </main>
    

</body>


  <script>
    const STORAGE_KEY = "iphone_todo_list";

    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const todoInput = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todoList");
    const status = document.getElementById("status");
    const clearCompleted = document.getElementById("clearCompleted");


    // บันทึกข้อมูลลงเครื่อง
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }


    // แสดงรายการ
    function renderTodos() {

      todoList.innerHTML = "";

      if (todos.length === 0) {
        todoList.innerHTML = `

        `;
      } else {

        todos.forEach(todo => {

          const item = document.createElement("div");

          item.className = "todo" + (todo.completed ? " completed" : "");

          item.innerHTML = `
            <input type="checkbox"
              ${todo.completed ? "checked" : ""}
            >

            <div class="todo-text"></div>

            <button class="delete-btn" aria-label="ลบงาน">🗑️</button>

          `;

          // ป้องกันข้อความจากผู้ใช้ถูกตีความเป็น HTML
          item.querySelector(".todo-text").textContent = todo.text;

          // เปลี่ยนสถานะงาน
          item.querySelector('input[type="checkbox"]')
            .addEventListener("change", () => {

              todo.completed = !todo.completed;

              saveTodos();
              renderTodos();
            });


          // ลบงาน
          item.querySelector(".delete-btn")
            .addEventListener("click", () => {

              todos = todos.filter(t => t.id !== todo.id);

              saveTodos();
              renderTodos();
            });


          todoList.appendChild(item);
        });
      }


      // แสดงจำนวนงาน
      const remaining = todos.filter(todo => !todo.completed).length;

      if (todos.length === 0) {
        status.textContent = "ยังไม่มีงาน";
      } else if (remaining === 0) {
        status.textContent = "🎉 ทำงานครบทั้งหมดแล้ว";
      } else {
        status.textContent =
          `เหลืออีก ${remaining} งาน จากทั้งหมด ${todos.length} งาน`;
      }
    }


    // เพิ่มงาน
    function addTodo() {

      const text = todoInput.value.trim();

      if (text === "") {
        todoInput.focus();
        return;
      }

      todos.unshift({
        id: Date.now(),
        text: text,
        completed: false
      });

      saveTodos();

      todoInput.value = "";

      renderTodos();
    }


    // ปุ่มเพิ่ม
    addBtn.addEventListener("click", addTodo);


    // กด Enter เพื่อเพิ่ม
    todoInput.addEventListener("keydown", event => {

      if (event.key === "Enter") {
        addTodo();
      }

    });


    // ลบงานที่ทำเสร็จทั้งหมด
    clearCompleted.addEventListener("click", () => {

      todos = todos.filter(todo => !todo.completed);

      saveTodos();
      renderTodos();

    });


    // เริ่มต้นแสดงข้อมูล
    renderTodos();

  </script>


</html>
